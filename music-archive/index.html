for (const value of [...new Set(collection.map(album => album.year))].sort((a, b) => b - a)) {

}

function showDetail(album) {
  document.querySelector('#detail-title').textContent = album.title;
  const cover = document.querySelector('#detail-cover');
  cover.src = album.cover;
  cover.alt = album.hindi + ' का CD कवर';
  document.querySelector('#detail-year').textContent = album.year;
  detail.showModal();
}

  old: (a, b) => a.year - b.year,
  name: (a, b) => a.title.localeCompare(b.title)
};

function render() {
  const query = search.value.toLowerCase().trim().split(/\s+/);
  const matches = collection.filter(album => {
    const searchable = [album.title, album.hindi, album.year].join(' ').toLowerCase();
    return (!year.value || String(album.year) === year.value)
      && query.every(word => searchable.includes(word));
  }).sort(ordering[sort.value]);

  const cards = matches.map(album => {
    const card = template.content.firstElementChild.cloneNode(true);
    card.querySelector('img').src = album.cover;
    card.querySelector('strong').textContent = album.title;
    card.querySelector('.meta').textContent = album.hindi + ' · ' + album.year;
    card.addEventListener('click', () => showDetail(album));
    return card;
  });
  grid.replaceChildren(...cards);
  status.textContent = matches.length ? matches.length + ' एल्बम' : 'कोई एल्बम नहीं मिला।';
}

search.addEventListener('input', render);
year.addEventListener('change', render);
sort.addEventListener('change', render);
render();
</script>
</body>
</html>
